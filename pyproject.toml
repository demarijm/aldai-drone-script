[project]
name = "drone-dock-agent"
version = "0.1.0"
description = "Raspberry Pi folder watcher for Hextronics drone dock uploads + inference triggers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0,<3",
  "watchdog>=4.0.0,<7",
]

[project.scripts]
drone-dock-agent = "drone_dock_agent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_dock_agent"]
