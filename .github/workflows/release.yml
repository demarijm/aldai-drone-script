name: Release binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build static release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/unspace
      - name: Verify binary size
        run: |
          size_bytes=$(stat -c%s target/${{ matrix.target }}/release/unspace)
          max_bytes=$((5 * 1024 * 1024))
          echo "unspace size: ${size_bytes} bytes"
          test "$size_bytes" -lt "$max_bytes"
      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/unspace dist/unspace-linux-${{ matrix.target }}
          sha256sum dist/unspace-linux-${{ matrix.target }} > dist/unspace-linux-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: unspace-linux-${{ matrix.target }}
          path: dist/*
